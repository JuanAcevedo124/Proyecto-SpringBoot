spring.application.name=coworkhub

# ---------------------------------------------------------------
# Servidor (se puede cambiar con la variable de entorno PORT)
# ---------------------------------------------------------------
server.port=${PORT:8080}

# ---------------------------------------------------------------
# Base de datos MySQL
# Con Docker en otro puerto, ajusta DB_URL, p. ej.:
#   DB_URL=jdbc:mysql://localhost:3307/coworkhub
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/coworkhub}
spring.datasource.username=${DB_USER:coworkhub}
spring.datasource.password=${DB_PASSWORD:coworkhub}

# ---------------------------------------------------------------
# JPA / Hibernate
# create: borra y recrea las tablas en cada arranque y ejecuta import.sql
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false

# ---------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false

# ---------------------------------------------------------------
# Configuracion propia de la aplicacion
# ---------------------------------------------------------------
# Zona horaria del reloj de negocio (RN-03, RN-08). Vacio = zona del sistema.
app.zona-horaria=${APP_ZONA:}

# ---------------------------------------------------------------
# JWT
# ADVERTENCIA EDUCATIVA: esta clave es SOLO para desarrollo y esta en el repositorio a proposito
# para que el proyecto arranque sin configuracion extra. En produccion se define con la variable
# de entorno JWT_SECRETO (minimo 32 caracteres) y nunca se sube al repositorio.
# ---------------------------------------------------------------
app.jwt.secreto=${JWT_SECRETO:clave-de-desarrollo-coworkhub-solo-para-clases-cambiar-en-produccion}
app.jwt.expiracion-minutos=60

# ---------------------------------------------------------------
# Swagger / OpenAPI (springdoc)
# ---------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.show-actuator=true
springdoc.default-produces-media-type=application/json
